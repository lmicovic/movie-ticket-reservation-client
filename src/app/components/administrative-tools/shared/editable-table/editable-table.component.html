<div class="main-container" [ngStyle]="{'paddingBottom': expanded ? '' : '2px'}">

    <div class="main-container-title" (click)="onExpand()">
        <span>
            {{ tableTitle }} 
            <span *ngIf="expandable === true">
                <fa-icon class="icon arrowDownIcon" [icon]="expanded ? arrowUpIcon : arrowDownIcon"></fa-icon>
            </span>
        </span>
    </div>

    <div class="main-container-table" [@expandCollapse] = "expanded === true ? 'expand' : 'collapse'" [ngStyle]="{'marginTop': tableMarginTop}">

        <table>

            <thead>
                <tr>
                    <ng-container *ngFor="let header of tableData?.headers">
                        <th>{{ header }}</th>
                    </ng-container>
                </tr>
            </thead>

            <tbody>

                <tr *ngFor="let row of tableData?.data">
                    <ng-container *ngFor="let rowData of row">
                        <td>{{ rowData }}</td>
                    </ng-container>
                </tr>

            </tbody>

        </table>

        <div class="pagination-container" [ngStyle]="{'marginTop': paginationMaringTop}" *ngIf="pagination === true">
            <p-paginator class="pagination-item" (onPageChange)="onPaginationChange($event)" [first]="first" [rows]="rows" [totalRecords]="120"></p-paginator>
        </div>

    </div>

</div>
