<div class="main-container" [ngStyle]="{'paddingBottom': expanded ? '' : '2px'}">

    <div class="main-container-title" (click)="onExpand()">
        <span>
            {{ tableTitle }} 
            <span *ngIf="expandable === true">
                <fa-icon class="icon arrowDownIcon" [icon]="expanded ? arrowUpIcon : arrowDownIcon"></fa-icon>
            </span>
        </span>
    </div>

    <div class="main-container-table" [@expandCollapse] = "expanded === true ? 'expand' : 'collapse'" [ngStyle]="{'marginTop': tableMarginTop}">

        <table>

            <thead>
                <tr>
                    <ng-container *ngFor="let header of headers">
                        <th>{{ header }}</th>
                    </ng-container>
                    <!-- <th>Id</th>
                    <th>Movie</th>
                    <th>Room</th>
                    <th>Date</th>
                    <th>Price</th> -->
                </tr>
            </thead>

            <tbody>

                <tr *ngFor="let row of tableData">
                    <ng-container *ngFor="let rowData of row">
                        <td>{{ rowData }}</td>
                    </ng-container>
                </tr>
